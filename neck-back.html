.ear{position:relative;aspect-ratio:940/1520;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);isolation:isolate}
.ear img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.ear::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);border-radius:28px;pointer-events:none}
.pt{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;z-index:2}
.pt i{position:absolute;inset:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 4.5px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.4);transition:transform .2s}
.pt[data-l="0"] i{background:#fff;box-shadow:0 0 0 3px var(--c),0 0 0 4.5px rgba(255,255,255,.9),0 3px 8px rgba(0,0,0,.4)}
.pt::before,.pt::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;opacity:0;transform:scale(.6)}
.pt:hover i,.pt[aria-pressed="true"] i{transform:scale(1.25)}
.pt[aria-pressed="true"]::before{animation:ring 1.8s ease-out infinite}.pt[aria-pressed="true"]::after{animation:ring 1.8s ease-out .9s infinite}
.pt[aria-pressed="true"] i{transform:scale(1.35);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 0 0 8px #fff,0 4px 12px rgba(0,0,0,.5)}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(2.8);opacity:0}}
.pt.dim{opacity:.18;pointer-events:none}
.pt[data-l="2"]{--c:var(--evi)} .pt[data-l="1"]{--c:var(--trad)} .pt[data-l="0"]{--c:var(--none)}
.pt-tip{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.pt:hover .pt-tip,.pt:focus-visible .pt-tip{opacity:1}
.zones{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .35s;mix-blend-mode:multiply}
.nz{opacity:.55;transition:opacity .25s}
.nz[data-n="gon"]{fill:#F2A93B}.nz[data-n="loc"]{fill:#4FC28A}.nz[data-n="ton"]{fill:#E86AA8}.nz[data-n="gan"]{fill:#8B7BE8}.nz[data-n="dr"]{fill:#2BB5C7}.nz[data-n="scn"]{fill:#D9C63B}
.zones.focus .nz{opacity:.14}.zones.focus .nz.on{opacity:.75}
.zl{position:absolute;left:14px;right:14px;top:14px;z-index:3;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#152322;opacity:0;transition:opacity .35s;pointer-events:none}
.zl span{background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px}
.zl span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.zl span[data-n="gon"]::before{background:#F2A93B}.zl span[data-n="loc"]::before{background:#4FC28A}.zl span[data-n="ton"]::before{background:#E86AA8}.zl span[data-n="gan"]::before{background:#8B7BE8}.zl span[data-n="dr"]::before{background:#2BB5C7}.zl span[data-n="scn"]::before{background:#D9C63B}

const P = [{"id": "gb20", "lvl": 2, "nerve": "gon", "pos": [[39.4, 42.1], [60.6, 42.1]], "name": "Фэн-чи", "alt": "GB20 · 风池 · «пруд ветра»", "zone": "Под затылком, в ямке между трапециевидной и грудино-ключично-сосцевидной мышцами", "trad": "Головная боль, головокружение, «ветер» (простуда), напряжение шеи, глаза. Одна из самых используемых точек тела.", "why": "По традиции сюда «заходит ветер», отсюда показания от простуды до головокружения. Ямка легко находится пальцем, поэтому точка стала главной в массаже шеи.", "evi": "Точка есть почти в каждом протоколе исследований по головной боли напряжения и боли в шее. Кокрейн (2016, Linde): акупунктура при головной боли напряжения даёт небольшой, но устойчивый эффект по сравнению с имитацией, качество доказательств среднее. Кокрейн (2016, Trinh) по хронической боли в шее: облегчение сразу после курса, качество низкое. Вклад именно этой точки не выделен.", "src": ["Cochrane, 2016 (Linde): акупунктура при головной боли напряжения", "Cochrane, 2016 (Trinh): акупунктура при боли в шее"], "under": "Под кожей: край трапециевидной мышцы, глубже — полуостистая и подзатылочные мышцы. Ещё глубже проходит позвоночная артерия, поэтому глубокие уколы здесь делают только специалисты; давление пальцем эту глубину не достаёт."}, {"id": "bl10", "lvl": 1, "nerve": "ton", "pos": [[43.6, 46.1], [56.4, 46.1]], "name": "Тянь-чжу", "alt": "BL10 · 天柱 · «небесный столб»", "zone": "У края волос, на 1,3 цуня в сторону от средней линии, на трапециевидной мышце", "trad": "Затылочная боль, ригидность шеи, заложенность носа, «ясность головы».", "why": "Название — «столб, держащий небо (голову)». Точка на мышцах, которые действительно держат голову, и болезненна почти у всех, кто сидит за экраном.", "evi": "Входит в протоколы по боли в шее и затылочной головной боли вместе с Фэн-чи. Отдельно не изучалась.", "src": ["Cochrane, 2016 (Trinh)"], "under": "Под кожей: трапециевидная, под ней ременная и полуостистая мышцы. Здесь выходит задняя ветвь C2–C3."}, {"id": "gv16", "lvl": 0, "nerve": "gon", "pos": [[50.0, 40.8]], "name": "Фэн-фу", "alt": "GV16 · 风府 · «дворец ветра»", "zone": "Средняя линия, на 1 цунь выше края волос, под затылочным бугром", "trad": "Головная боль, головокружение, «ветер», психические состояния, речь.", "why": "Ещё одна точка «ветра». В старых текстах — одна из точек, через которые «ветер входит в мозг».", "evi": "Отдельных данных нет. Точка известна не эффектом, а опасностью: под ней атланто-затылочная мембрана и продолговатый мозг, глубина укола строго ограничена. Давление пальцем безопасно.", "src": ["Учебники акупунктуры: точки с ограниченной глубиной укола"], "under": "Под кожей: выйная связка, затем промежуток между затылочной костью и атлантом, за ним — продолговатый мозг. Мышц, которые можно «размять», здесь нет."}, {"id": "gv15", "lvl": 0, "nerve": "ton", "pos": [[50.0, 45.4]], "name": "Я-мэнь", "alt": "GV15 · 哑门 · «врата немоты»", "zone": "Средняя линия, на 0,5 цуня выше края волос, между C1 и C2", "trad": "Нарушения речи, ригидность затылка, «немота».", "why": "Название говорит само: точка «от немоты». Классический пример того, как традиция связала место с симптомом без механизма.", "evi": "Исследований нет. Та же осторожность, что у Фэн-фу: под точкой спинной мозг.", "src": ["Учебники акупунктуры"], "under": "Под кожей: выйная связка, промежуток между атлантом и осевым позвонком, спинной мозг."}, {"id": "gb21", "lvl": 1, "nerve": "scn", "pos": [[28.2, 69.4], [71.8, 69.4]], "name": "Цзянь-цзин", "alt": "GB21 · 肩井 · «колодец плеча»", "zone": "Середина расстояния между C7 и акромионом, на верхнем крае трапеции", "trad": "Напряжение плеч и шеи, головная боль, лактация; в традиции запрещена при беременности.", "why": "Самая «очевидная» точка тела: там, где все трут плечи. Совпадает с триггерной точкой верхней трапеции по Трэвелл.", "evi": "Входит в протоколы по боли в шее и плечах, отдельно не изучена. Известна побочным эффектом: под точкой верхушка лёгкого, и пневмоторакс после глубокого укола здесь описан в литературе не раз.", "src": ["Cochrane, 2016 (Trinh)", "Обзоры нежелательных явлений акупунктуры: пневмоторакс"], "under": "Под кожей: верхний пучок трапециевидной мышцы, под ним надостная мышца и верхушка лёгкого. Давление безопасно, глубокий укол — нет."}, {"id": "gv14", "lvl": 0, "nerve": "dr", "pos": [[50.0, 68.1]], "name": "Да-чжуй", "alt": "GV14 · 大椎 · «большой позвонок»", "zone": "Средняя линия, под остистым отростком C7", "trad": "Жар, простуда, «место встречи всех ян-каналов», ригидность шеи.", "why": "Самый заметный позвонок стал главной точкой «жара». Здесь традиционно ставили банки и делали кровопускание.", "evi": "Отдельных надёжных данных нет.", "src": ["Китайский стандарт GB/T 12346"], "under": "Под кожей: надостистая связка между C7 и T1. Мышц почти нет, поэтому точка болезненна при давлении."}, {"id": "trp_trap", "lvl": 1, "nerve": "scn", "pos": [[30.9, 66.1], [69.1, 66.1]], "name": "Триггер верхней трапеции", "alt": "Travell & Simons, TrP1 · не акупунктура", "zone": "Передний край верхнего пучка трапециевидной мышцы, чуть выше Цзянь-цзин", "trad": "Миофасциальная медицина: узел в мышце, боль отдаёт в висок и за ухо, «головная боль от плеч».", "why": "Это другая традиция, американская, 1980-х. Трэвелл описала карты отражённой боли по пальпации, без визуализации. Половина её точек совпадает с акупунктурными.", "evi": "Сухое иглоукалывание триггерных точек снижает боль в шее на короткий срок (обзоры 2017–2023, качество низкое-среднее). Сам триггер как структура спорен: в 2015 году ревматологи (Quintner) показали, что его никто не увидел на УЗИ или биопсии воспроизводимо.", "src": ["Systematic reviews of dry needling for neck pain, 2017–2023", "Quintner et al., Rheumatology, 2015: критика концепции триггерных точек"], "under": "Под кожей: верхняя трапеция, в её толще идёт добавочный нерв (XI), который её и двигает."}, {"id": "trp_spl", "lvl": 1, "nerve": "gan", "pos": [[38.8, 50.0], [61.2, 50.0]], "name": "Триггер ременной мышцы", "alt": "Travell & Simons · splenius capitis", "zone": "Боковая поверхность шеи на уровне C2–C3, позади края грудино-ключично-сосцевидной мышцы", "trad": "Миофасциальная медицина: боль отдаёт в темя, «шапка боли». Мышца поворачивает и запрокидывает голову.", "why": "Ременная мышца лежит под трапецией и её легко принять за трапецию при пальпации.", "evi": "Отдельных испытаний почти нет, точка входит в протоколы сухого иглоукалывания при боли в шее вместе с трапецией.", "src": ["Systematic reviews of dry needling for neck pain"], "under": "Под кожей: край трапеции, под ним ременная мышца головы, глубже — полуостистая."}, {"id": "trp_lev", "lvl": 1, "nerve": "scn", "pos": [[35.1, 63.1], [64.9, 63.1]], "name": "Триггер мышцы, поднимающей лопатку", "alt": "Travell & Simons · levator scapulae", "zone": "Угол шеи над верхним углом лопатки", "trad": "Миофасциальная медицина: «ригидная шея», невозможно повернуть голову, боль в углу шеи.", "why": "Трэвелл называла её самой частой причиной «утренней ригидности шеи». Мышца тянет лопатку вверх и напрягается от сумки на плече и телефона у уха.", "evi": "Сухое иглоукалывание этой мышцы изучалось в небольших РКИ при боли в шее, эффект краткосрочный.", "src": ["Systematic reviews of dry needling for neck pain"], "under": "Под кожей: трапеция, под ней мышца, поднимающая лопатку, идёт от поперечных отростков C1–C4 к углу лопатки."}];
const EN={"gb20": {"name": "Feng Chi", "alt": "GB20 · 风池 · “Wind Pool”", "zone": "Below the occiput, in the hollow between trapezius and sternocleidomastoid", "trad": "Headache, dizziness, “wind” (colds), neck tension, eyes. One of the most used points on the body.", "why": "Tradition says “wind enters” here, hence indications from colds to dizziness. The hollow is easy to find with a finger, which made it the main point in neck massage.", "evi": "Present in almost every trial protocol for tension-type headache and neck pain. Cochrane (2016, Linde): acupuncture for tension-type headache gives a small but consistent effect over sham, moderate-quality evidence. Cochrane (2016, Trinh) on chronic neck pain: relief right after a course, low quality. The contribution of this single point is not isolated.", "src": ["Cochrane, 2016 (Linde): acupuncture for tension-type headache", "Cochrane, 2016 (Trinh): acupuncture for neck pain"], "under": "Under the skin: the edge of trapezius, deeper semispinalis and the suboccipital muscles. Deeper still runs the vertebral artery, so deep needling here is for professionals only; finger pressure does not reach that depth."}, "bl10": {"name": "Tian Zhu", "alt": "BL10 · 天柱 · “Celestial Pillar”", "zone": "At the hairline, 1.3 cun lateral to the midline, on trapezius", "trad": "Occipital headache, stiff neck, nasal congestion, “clear head”.", "why": "The name means “the pillar holding up heaven (the head)”. The point sits on the muscles that really do hold the head, and is tender in almost everyone who works at a screen.", "evi": "Included in neck-pain and occipital-headache protocols together with Feng Chi. Not studied on its own.", "src": ["Cochrane, 2016 (Trinh)"], "under": "Under the skin: trapezius, then splenius and semispinalis. The dorsal ramus of C2–C3 emerges here."}, "gv16": {"name": "Feng Fu", "alt": "GV16 · 风府 · “Wind Mansion”", "zone": "Midline, 1 cun above the hairline, below the occipital protuberance", "trad": "Headache, dizziness, “wind”, mental states, speech.", "why": "Another “wind” point. In old texts, one of the gates through which wind enters the brain.", "evi": "No data on its own. The point is known not for its effect but for its danger: beneath it lie the atlanto-occipital membrane and the medulla oblongata, and needling depth is strictly limited. Finger pressure is safe.", "src": ["Acupuncture textbooks: points with restricted needling depth"], "under": "Under the skin: the nuchal ligament, then the gap between occipital bone and atlas, behind it the medulla oblongata. There are no muscles here to “knead”."}, "gv15": {"name": "Ya Men", "alt": "GV15 · 哑门 · “Gate of Muteness”", "zone": "Midline, 0.5 cun above the hairline, between C1 and C2", "trad": "Speech disorders, stiff neck, “muteness”.", "why": "The name says it: a point “against muteness”. A classic case of tradition linking a place to a symptom with no mechanism.", "evi": "No studies. Same caution as Feng Fu: the spinal cord lies beneath.", "src": ["Acupuncture textbooks"], "under": "Under the skin: the nuchal ligament, the gap between atlas and axis, the spinal cord."}, "gb21": {"name": "Jian Jing", "alt": "GB21 · 肩井 · “Shoulder Well”", "zone": "Midway between C7 and the acromion, on the upper edge of trapezius", "trad": "Shoulder and neck tension, headache, lactation; traditionally forbidden in pregnancy.", "why": "The most obvious point on the body: where everyone rubs their shoulders. Coincides with the upper-trapezius trigger point of Travell.", "evi": "Included in neck and shoulder pain protocols, not studied alone. Known for an adverse effect: the apex of the lung lies beneath, and pneumothorax after deep needling here is described repeatedly.", "src": ["Cochrane, 2016 (Trinh)", "Reviews of acupuncture adverse events: pneumothorax"], "under": "Under the skin: the upper trapezius, beneath it supraspinatus and the apex of the lung. Pressure is safe, deep needling is not."}, "gv14": {"name": "Da Zhui", "alt": "GV14 · 大椎 · “Great Vertebra”", "zone": "Midline, below the spinous process of C7", "trad": "Fever, colds, “meeting of all yang channels”, stiff neck.", "why": "The most prominent vertebra became the main “heat” point. Cupping and bloodletting were traditionally done here.", "evi": "No reliable data on its own.", "src": ["Chinese standard GB/T 12346"], "under": "Under the skin: the supraspinous ligament between C7 and T1. Almost no muscle, which is why the point is tender to pressure."}, "trp_trap": {"name": "Upper trapezius trigger point", "alt": "Travell & Simons, TrP1 · not acupuncture", "zone": "Anterior edge of the upper trapezius, just above Jian Jing", "trad": "Myofascial medicine: a knot in the muscle, pain referred to the temple and behind the ear, “headache from the shoulders”.", "why": "A different tradition, American, from the 1980s. Travell mapped referred pain by palpation, without imaging. Half of her points coincide with acupuncture points.", "evi": "Dry needling of trigger points reduces neck pain in the short term (reviews 2017–2023, low to moderate quality). The trigger point as a structure is disputed: in 2015 rheumatologists (Quintner) showed nobody had seen it reproducibly on ultrasound or biopsy.", "src": ["Systematic reviews of dry needling for neck pain, 2017–2023", "Quintner et al., Rheumatology, 2015: critique of the trigger-point concept"], "under": "Under the skin: the upper trapezius; the accessory nerve (XI), which drives it, runs within it."}, "trp_spl": {"name": "Splenius capitis trigger point", "alt": "Travell & Simons · splenius capitis", "zone": "Lateral neck at C2–C3, behind the posterior edge of sternocleidomastoid", "trad": "Myofascial medicine: pain referred to the vertex, a “cap of pain”. The muscle turns and extends the head.", "why": "Splenius lies under trapezius and is easily mistaken for it on palpation.", "evi": "Almost no trials on its own; included in dry-needling protocols for neck pain together with trapezius.", "src": ["Systematic reviews of dry needling for neck pain"], "under": "Under the skin: the edge of trapezius, beneath it splenius capitis, deeper semispinalis."}, "trp_lev": {"name": "Levator scapulae trigger point", "alt": "Travell & Simons · levator scapulae", "zone": "Angle of the neck above the superior angle of the scapula", "trad": "Myofascial medicine: “stiff neck”, unable to turn the head, pain at the angle of the neck.", "why": "Travell called it the most common cause of a “stiff neck in the morning”. The muscle lifts the scapula and tenses from a bag on the shoulder or a phone at the ear.", "evi": "Dry needling of this muscle was studied in small RCTs for neck pain, effect short-term.", "src": ["Systematic reviews of dry needling for neck pain"], "under": "Under the skin: trapezius, beneath it levator scapulae running from the transverse processes of C1–C4 to the angle of the scapula."}};
const UI={"ru": {"title": "Шея, вид сзади.<br><em>Атлас точек</em> по слоям", "by": "Атлас Виктории Филипповой — врача клинической лабораторной диагностики, ставшего UX-дизайнером. ", "lead": "Сдвинь глубину: кожа, сосуды, нервы, мышцы, кости. Нажми точку: что ей приписывает традиция, что известно на самом деле и что лежит под ней.", "s1": "точек", "s2": "слоёв", "s3": "с систематическими обзорами", "depth": "Глубина", "layers": ["кожа", "сосуды", "нервы", "мышцы", "кости"], "f_all": "Все", "f_2": "Есть обзоры", "f_01": "Только традиция", "l2": "систематические обзоры", "l1": "отдельные испытания, низкое качество", "l0": "только традиция", "empty_h": "Нажми на точку", "empty_p": "Парные точки стоят с двух сторон, карточка у них общая. У каждой два слоя: традиция и исследования, плюс строка «что под кожей».", "h_trad": "Что говорит традиция", "h_evi": "Что известно на самом деле", "under": "Что под кожей.", "cart": "Пластина эластического хряща.", "lobe": "Мочка: хряща нет, жир и фиброзная ткань.", "innerv": "Кожу здесь иннервирует", "show": "Показать зону на слое нервов", "LVL": {"2": "есть обзоры", "1": "испытания низкого качества", "0": "только традиция"}, "NERVE": {"gon": "большой затылочный нерв (C2): затылок и кожа головы сзади до темени", "loc": "малый затылочный нерв (C2): кожа за ухом и боковая часть затылка", "ton": "третий затылочный нерв (C3): узкая полоска по средней линии под затылком", "gan": "большой ушной нерв (C2–C3): кожа под ухом и боковая поверхность шеи", "dr": "задние ветви спинномозговых нервов C3–T2: задняя поверхность шеи и верх спины по обе стороны от позвоночника", "scn": "надключичные нервы (C3–C4): надплечья"}, "zl": {"gon": "большой затылочный (C2)", "loc": "малый затылочный (C2)", "ton": "третий затылочный (C3)", "gan": "большой ушной (C2–C3)", "dr": "задние ветви C3–T2", "scn": "надключичные (C3–C4)"}, "sec_h": "Глубже: срез", "sec_p": "Точки живут на поверхности, но полезно понимать, на чём они лежат. Раковина — это одна пластина эластического хряща в оболочке кожи; хряща нет только в мочке, там жир и фиброзная ткань. Слуховой проход на трети хрящевой, дальше — кость височной черепа, и заканчивается барабанной перепонкой.", "kv": [["кожа", "тонкая, без сосочков, плотно сращена с хрящом. Поэтому воспаление уха так болит"], ["хрящ", "единая пластина, повторяет все складки"], ["жир", "мочка и подкожная клетчатка"], ["кость", "внутренние две трети слухового прохода"]], "foot": "Это не назначение и не замена визита к врачу. Если что-то беспокоит, покажите это своему врачу.", "sig": "Виктория Филиппова · Kikodoc.design · 2026", "alt_img": "Затылок и шея, вид сзади", "alt_sec": "Срез через ушную раковину и наружный слуховой проход", "theme": "Переключить тему", "close": "Закрыть", "depth_aria": "Глубина среза", "filter_aria": "Фильтр по уровню доказательств", "nav_brand": "Атлас точек по слоям", "nav_ear": "Ухо", "nav_neck": "Шея, вид сзади", "nav_side": "Шея, вид сбоку — скоро"}, "en": {"title": "The neck, from behind.<br><em>A point atlas</em>, layer by layer", "by": "An atlas by Viktoria Filippova — a clinical laboratory physician turned UX designer. ", "lead": "Slide the depth: skin, vessels, nerves, muscles, bones. Tap a point: what tradition claims, what is actually known, and what lies beneath it.", "s1": "points", "s2": "layers", "s3": "with systematic reviews", "depth": "Depth", "layers": ["skin", "vessels", "nerves", "muscles", "bones"], "f_all": "All", "f_2": "Has reviews", "f_01": "Tradition only", "l2": "systematic reviews", "l1": "single trials, low quality", "l0": "tradition only", "empty_h": "Tap a point", "empty_p": "Paired points appear on both sides and share one card. Each has two layers: tradition and research, plus a line on what lies under the skin.", "h_trad": "What tradition says", "h_evi": "What is actually known", "under": "Under the skin.", "cart": "A plate of elastic cartilage.", "lobe": "The lobe: no cartilage, fat and fibrous tissue.", "innerv": "The skin here is supplied by the", "show": "Show the zone on the nerve layer", "LVL": {"2": "has reviews", "1": "low-quality trials", "0": "tradition only"}, "NERVE": {"gon": "greater occipital nerve (C2): the occiput and back of the scalp up to the vertex", "loc": "lesser occipital nerve (C2): skin behind the ear and the lateral occiput", "ton": "third occipital nerve (C3): a narrow midline strip below the occiput", "gan": "great auricular nerve (C2–C3): skin below the ear and the lateral neck", "dr": "dorsal rami of spinal nerves C3–T2: the back of the neck and upper back either side of the spine", "scn": "supraclavicular nerves (C3–C4): the tops of the shoulders"}, "zl": {"gon": "greater occipital (C2)", "loc": "lesser occipital (C2)", "ton": "third occipital (C3)", "gan": "great auricular (C2–C3)", "dr": "dorsal rami C3–T2", "scn": "supraclavicular (C3–C4)"}, "sec_h": "Deeper: the section", "sec_p": "Points live on the surface, but it helps to know what they sit on. The auricle is a single plate of elastic cartilage wrapped in skin; only the lobe has no cartilage, just fat and fibrous tissue. The ear canal is cartilaginous for its outer third, bony (temporal bone) beyond that, and ends at the eardrum.", "kv": [["skin", "thin, no papillae, tightly bound to the cartilage. That is why ear inflammation hurts so much"], ["cartilage", "one continuous plate, following every fold"], ["fat", "the lobe and subcutaneous tissue"], ["bone", "the inner two thirds of the ear canal"]], "foot": "This is not a prescription or a substitute for seeing a doctor. If something worries you, show it to your physician.", "sig": "Viktoria Filippova · Kikodoc.design · 2026", "alt_img": "Occiput and neck, posterior view", "alt_sec": "Section through the auricle and external ear canal", "theme": "Toggle theme", "close": "Close", "depth_aria": "Section depth", "filter_aria": "Filter by level of evidence", "nav_brand": "Point atlas, layer by layer", "nav_ear": "Ear", "nav_neck": "Neck, from behind", "nav_side": "Neck, side view — soon"}};
let lang="ru";try{lang=localStorage.getItem("atlas-lang")||"ru"}catch(e){}
const T=()=>UI[lang];const F=(p,k)=>lang==="en"?EN[p.id][k]:p[k];
let LVL=T().LVL;
let NERVE=T().NERVE;
const G=(n,p)=>{try{ym(110440302,"reachGoal",n,p)}catch(e){}};
const ear=document.getElementById("ear"),card=document.getElementById("card"),list=document.getElementById("list");
P.forEach(p=>{
  p.pos.forEach(([x,y],i)=>{const b=document.createElement("button");b.className="pt";b.dataset.id=p.id;b.dataset.l=p.lvl;
  b.style.left=x+"%";b.style.top=y+"%";b.setAttribute("aria-pressed","false");b.setAttribute("aria-label",F(p,"name")+", "+LVL[p.lvl]);
  b.innerHTML='<i></i><span class="pt-tip">'+F(p,"name")+'</span>';b.addEventListener("click",()=>select(p.id));ear.append(b);});
  const l=document.createElement("button");l.dataset.id=p.id;l.dataset.l=p.lvl;l.innerHTML='<i></i>'+F(p,"name");l.addEventListener("click",()=>select(p.id));list.append(l);
});
function select(id){
  const p=P.find(x=>x.id===id);G("point",{id:id,lang:lang,page:"neck"});
  document.querySelectorAll(".pt").forEach(g=>g.setAttribute("aria-pressed",g.dataset.id===id));
  document.querySelectorAll(".list button").forEach(b=>b.setAttribute("aria-current",b.dataset.id===id));
  card.classList.remove("empty-state");card.classList.add("open");
  const zs=document.getElementById("zones");zs.classList.add("focus");zs.querySelectorAll(".nz").forEach(q=>q.classList.toggle("on",q.dataset.n===p.nerve));
  const u=T();
  card.innerHTML=`<button class="close" aria-label="${u.close}" onclick="closeCard()">×</button>
    <p class="zone">${F(p,"zone")}</p>
    <h2>${F(p,"name")}<span class="badge b${p.lvl}">${LVL[p.lvl]}</span></h2>
    <p class="alt">${F(p,"alt")}</p>
    <div class="layer trad"><h3>${u.h_trad}</h3><p>${F(p,"trad")}</p><p>${F(p,"why")}</p></div>
    <div class="layer evi lvl${p.lvl}"><h3>${u.h_evi}</h3><p>${F(p,"evi")}</p><ul class="src">${F(p,"src").map(s=>"<li>"+s+"</li>").join("")}</ul></div>
    <p class="under"><b>${u.under}</b> ${F(p,"under").replace(/^(Под кожей|Under the skin): /,"")} ${u.innerv} ${NERVE[p.nerve]}. <button onclick="setDepth(200)">${u.show}</button></p>`;
}
function closeCard(){card.classList.remove("open");document.querySelectorAll(".pt").forEach(g=>g.setAttribute("aria-pressed","false"))}
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
  const f=c.dataset.f,ok=l=>f==="all"||(f==="2"&&l===2)||(f==="01"&&l<2);
  document.querySelectorAll(".pt,.list button").forEach(b=>b.classList.toggle("dim",!ok(+b.dataset.l)));
  const sel=document.querySelector('.pt[aria-pressed="true"]');if(sel&&!ok(+sel.dataset.l))closeCard();
}));
const depth=document.getElementById("depth"),imgs=[...ear.querySelectorAll("img")],ln=document.getElementById("ln");let names=T().layers;
function render(){
  const v=+depth.value;
  imgs.forEach(im=>{const i=+im.dataset.i;im.style.opacity=i===0?1:Math.max(0,Math.min(1,1-Math.abs(v-100*i)/100+ (v>100*i?1:0)));});
  const n=Math.round(v/100);ln.textContent=names[n];depth.setAttribute("aria-valuetext",names[n]);
  document.querySelectorAll("#dl button").forEach(b=>b.setAttribute("aria-current",+b.dataset.v===n*100));
}
/* stacking: deeper layers sit below; a layer becomes visible as depth passes it, so fade the shallower ones out instead */
function render(){
  const v=+depth.value;
  imgs.forEach(im=>{const i=+im.dataset.i;im.style.opacity=Math.max(0,Math.min(1,1-(v-100*i)/100));});
  const n=Math.round(v/100);ln.textContent=names[n];depth.setAttribute("aria-valuetext",names[n]);
  document.querySelectorAll("#dl button").forEach(b=>b.setAttribute("aria-current",+b.dataset.v===n*100));
  const z=Math.max(0,1-Math.abs(v-200)/80);document.getElementById("zones").style.opacity=z;document.getElementById("zl").style.opacity=z;
}
depth.addEventListener("change",()=>G("depth",{layer:names[Math.round(depth.value/100)],page:"neck"}));depth.addEventListener("input",render);render();
function setDepth(v){if(innerWidth<900)card.classList.remove("open");const s=+depth.value,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/500);depth.value=s+(v-s)*(1-Math.pow(1-k,3));render();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);ear.scrollIntoView({behavior:"smooth",block:"center"})}
document.querySelectorAll("#dl button").forEach(b=>b.addEventListener("click",()=>setDepth(+b.dataset.v)));
function applyLang(){
  const u=T();LVL=u.LVL;NERVE=u.NERVE;names=u.layers;document.documentElement.lang=lang;document.getElementById("lang").textContent=lang==="ru"?"EN":"RU";
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=u[el.dataset.t]});
  document.querySelectorAll("#dl button").forEach((b,i)=>b.textContent=u.layers[i]);
  document.querySelectorAll("#zl span").forEach(sp=>sp.textContent=u.zl[sp.dataset.n]);
  document.getElementById("theme").setAttribute("aria-label",u.theme);depth.setAttribute("aria-label",u.depth_aria);document.querySelector(".filters").setAttribute("aria-label",u.filter_aria);
  document.querySelector("#ear img[data-i='0']").alt=u.alt_img;
  P.forEach(p=>{ear.querySelectorAll(`.pt[data-id="${p.id}"]`).forEach(b=>{b.setAttribute("aria-label",F(p,"name")+", "+LVL[p.lvl]);b.querySelector(".pt-tip").textContent=F(p,"name")});list.querySelector(`button[data-id="${p.id}"]`).innerHTML='<i></i>'+F(p,"name")});
  render();const sel=document.querySelector('.pt[aria-pressed="true"]');if(sel)select(sel.dataset.id);
}
document.getElementById("lang").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";G("lang",{lang:lang});try{localStorage.setItem("atlas-lang",lang)}catch(e){}applyLang()});
applyLang();
const root=document.documentElement,tb=document.getElementById("theme");
try{const t=localStorage.getItem("ear-theme");if(t)root.dataset.theme=t}catch(e){}
tb.addEventListener("click",()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("ear-theme",root.dataset.theme)}catch(e){}});
</script>
