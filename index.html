.hdr-btns{display:flex;gap:8px;justify-self:end}.theme,.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;cursor:pointer}.theme{width:40px}.lang{padding:0 14px;font-weight:700;letter-spacing:.06em}

/* stage */
.stage{display:grid;gap:20px;margin-top:18px}
@media(min-width:900px){.stage{grid-template-columns:120px minmax(320px,520px) 1fr;align-items:start}}
.depth{display:flex;flex-direction:column;gap:6px;padding:8px 0}.depth>div:first-child{width:100%}
@media(min-width:900px){.depth{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);flex-direction:row;gap:14px;height:560px}.depth>div:first-child{width:auto;display:flex;flex-direction:column}.depth>div:first-child input{flex:1}}
.depth-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
@media(min-width:900px){.depth-labels{flex-direction:column;order:2;padding-left:6px}}
.depth-labels button{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:var(--muted);transition:color .2s}
.depth-labels button[aria-current="true"]{color:var(--ink);font-weight:700}
.depth input{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:linear-gradient(90deg,#E8B9A8,#C24E5E,#E7C35C,#C97A78,#B9C6D8);border-radius:99px;margin:0}
@media(min-width:900px){.depth input{writing-mode:vertical-lr;width:6px;height:100%;background:linear-gradient(180deg,#E8B9A8,#C24E5E,#E7C35C,#C97A78,#B9C6D8)}}
.depth input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:4px solid var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:grab}
.depth input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid var(--bg)}
.depth-title{font-size:12px;text-transform:none;color:var(--muted);margin-bottom:4px}

.ear{position:relative;aspect-ratio:941/1672;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);isolation:isolate}
.ear img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.ear::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);border-radius:28px;pointer-events:none}
.pt{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;z-index:2}
.pt i{position:absolute;inset:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 4.5px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.4);transition:transform .2s}
.pt[data-l="0"] i{background:#fff;box-shadow:0 0 0 3px var(--c),0 0 0 4.5px rgba(255,255,255,.9),0 3px 8px rgba(0,0,0,.4)}
.pt::before,.pt::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;opacity:0;transform:scale(.6)}
.pt:hover i,.pt[aria-pressed="true"] i{transform:scale(1.25)}
.pt[aria-pressed="true"]::before{animation:ring 1.8s ease-out infinite}.pt[aria-pressed="true"]::after{animation:ring 1.8s ease-out .9s infinite}
.pt[aria-pressed="true"] i{transform:scale(1.35);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 0 0 8px #fff,0 4px 12px rgba(0,0,0,.5)}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(2.8);opacity:0}}
.pt.dim{opacity:.18;pointer-events:none}
.pt[data-l="2"]{--c:var(--evi)} .pt[data-l="1"]{--c:var(--trad)} .pt[data-l="0"]{--c:var(--none)}
.pt-tip{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.pt:hover .pt-tip,.pt:focus-visible .pt-tip{opacity:1}
.zones{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .35s;mix-blend-mode:multiply}
.nz{opacity:.55;transition:opacity .25s}
.nz[data-n="atn"]{fill:#F2A93B}.nz[data-n="gan"]{fill:#8B7BE8}.nz[data-n="loc"]{fill:#4FC28A}.nz[data-n="vag"]{fill:#2BB5C7}.nz[data-n="fac"]{fill:#E86AA8;opacity:.7}
.zones.focus .nz{opacity:.14}.zones.focus .nz.on{opacity:.75}
.zl{position:absolute;left:14px;right:14px;top:14px;z-index:3;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#152322;opacity:0;transition:opacity .35s;pointer-events:none}
.zl span{background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px}
.zl span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.zl span[data-n="atn"]::before{background:#F2A93B}.zl span[data-n="gan"]::before{background:#8B7BE8}.zl span[data-n="loc"]::before{background:#4FC28A}.zl span[data-n="vag"]::before{background:#2BB5C7}.zl span[data-n="fac"]::before{background:#E86AA8}
.layer-name{position:absolute;left:16px;bottom:14px;z-index:3;font-family:Spectral,serif;font-size:22px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;transition:opacity .3s}

.card>*{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.b2{background:var(--evi)} .b1{background:var(--trad)} .b0{background:var(--none)}
.layer{border-left:4px solid;padding:12px 16px;border-radius:0 14px 14px 0;margin:12px 0}
.layer h3{font-family:Manrope,sans-serif;font-size:14px;font-weight:700;margin-bottom:6px}
.layer p{margin:0 0 8px} .layer p:last-child{margin:0}
.layer.trad{border-color:var(--trad);background:var(--trad-soft)}
.layer.evi{border-color:var(--evi);background:var(--evi-soft)}
.layer.evi.lvl0{border-color:var(--none);background:transparent;border:1px solid var(--line);border-left:4px solid var(--none)}
.src{font-size:13px;color:var(--muted);margin:10px 0 0;padding-left:18px}
.under{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--bg);margin:6px 0 0}
.under button{border:0;background:none;color:var(--evi);cursor:pointer;padding:0;font-weight:700;text-decoration:underline}
.empty h2{font-size:26px;margin-bottom:8px} .empty p{color:var(--muted);margin:0}
.list{display:flex;flex-wrap:wrap;gap:8px}

const EN={"shenmen": {"name": "Shen Men", "alt": "神门 · “Gate of the Spirit”", "zone": "Triangular fossa, near its apex", "trad": "The main calming point: anxiety, insomnia, pain, addiction. One of the five NADA protocol points.", "why": "In Chinese tradition it was the point through which the spirit is calmed. Its long list of indications is why almost every auriculotherapy trial includes it.", "evi": "The most studied ear point. In insomnia meta-analyses almost every trial includes Shen Men and Heart, and the pooled effect on sleep quality is positive. But the trials are small, heterogeneous, often without a proper sham, and the contribution of this single point cannot be separated. For pre-operative anxiety there are individual positive RCTs. For addiction (NADA protocol) the Cochrane review found no effect.", "src": ["Frontiers in Sleep, 2024: meta-analysis of auricular acupressure for insomnia", "Medicine, 2025: review of RCTs in breast-cancer insomnia, moderate-quality evidence", "Cochrane, 2006: auricular acupuncture for cocaine dependence"]}, "heart": {"name": "Heart", "alt": "心", "zone": "Centre of the lower concha (cavum conchae)", "trad": "Sleep, palpitations, anxiety, “heart heat”.", "why": "On the traditional map the concha corresponds to the chest organs. In Chinese medicine the Heart also governs the mind, hence the sleep indications.", "evi": "The second most frequent point in insomnia trials, usually paired with Shen Men. Reviews show improvement on the PSQI scale with the same caveat: small samples and very different methods. No effect on the heart itself has been shown.", "src": ["Frontiers in Sleep, 2024", "Medicine, 2025: Heart, Shen Men and Subcortex make up 72% of all points used"]}, "subcortex": {"name": "Subcortex", "alt": "皮质下", "zone": "Inner wall of the antitragus", "trad": "Pain, insomnia, “regulation of cortex and subcortex”, nausea.", "why": "The name gives away its era: the point was described in China in the 1950s–60s, when neurophysiology vocabulary was entering traditional charts.", "evi": "Regularly included in insomnia protocols together with Shen Men and Heart. The effect is shown only for combinations; the point has not been studied on its own.", "src": ["Medicine, 2025", "Frontiers in Sleep, 2024"]}, "cymba": {"name": "Kidney area / cymba conchae", "alt": "肾 · vagus nerve stimulation zone", "zone": "Upper concha, below the inferior crus of the antihelix", "trad": "“Kidney”: fatigue, low back, hearing, “innate energy”. In NADA it stands for recovery.", "why": "Here tradition and anatomy unexpectedly meet. The skin of the cymba conchae and part of the cavum conchae is supplied by the auricular branch of the vagus nerve. It is the only place on the body where the vagus reaches the surface.", "evi": "There are no studies on the “kidney”. But this exact zone is used in transcutaneous vagus nerve stimulation (taVNS): electrical stimulators with an electrode in the cymba conchae are CE-certified for epilepsy and depression, and inflammation and heart-rate studies are under way. That is neuromodulation, not reflexotherapy, and finger pressure must not be confused with it.", "src": ["Peuker & Filler, 2002: innervation of the auricle", "taVNS reviews (Frontiers in Neuroscience, 2020–2023)"]}, "lung": {"name": "Lung", "alt": "肺", "zone": "Concha, around the Heart point", "trad": "Breathing, skin, smoking cessation, pain relief.", "why": "In Chinese medicine the Lungs “govern the skin” and relate to grief, hence the wide list. Used in the NADA protocol for withdrawal.", "evi": "Auricular acupuncture and acupressure for smoking cessation have been studied many times. Cochrane review: no consistent, bias-free evidence of effect. Some positive RCTs exist, but with poor controls.", "src": ["Cochrane, 2014: acupuncture and related interventions for smoking cessation"]}, "liver": {"name": "Liver", "alt": "肝", "zone": "Posterior part of the lower concha", "trad": "Irritability, eyes, muscle spasms, “qi stagnation”.", "why": "One of the five NADA points. In tradition the Liver governs emotions and the “free flow of qi”.", "evi": "Not studied on its own. Within the NADA protocol for addiction the effect is not confirmed.", "src": ["Cochrane, 2006"]}, "symp": {"name": "Sympathetic", "alt": "交感", "zone": "End of the inferior crus of the antihelix, under the helix", "trad": "Autonomic regulation: spasms, abdominal pain, sweating, anxiety.", "why": "The fifth NADA point. Named after its supposed action on the sympathetic nervous system.", "evi": "Included in hypertension and insomnia trial protocols. A meta-analysis of 18 RCTs showed lower blood pressure, but the authors themselves call the study quality doubtful, and the points differ between trials.", "src": ["Evidence-Based CAM, 2020: auricular acupressure for hypertension with insomnia, 18 RCTs"]}, "endo": {"name": "Endocrine", "alt": "内分泌", "zone": "Intertragic notch", "trad": "Hormones, menstrual cycle, weight, allergy.", "why": "A point “for everything” tradition linked to the glands. Often used in weight-loss schemes.", "evi": "Reviews of auriculotherapy for obesity show small weight loss in short, low-quality trials. No effect on hormones has been shown.", "src": ["Systematic reviews of auricular acupressure for obesity, 2014–2022"]}, "hunger": {"name": "Hunger point", "alt": "饥点", "zone": "Tragus", "trad": "Appetite suppression.", "why": "One of the most popular points in commercial “appetite seeds”.", "evi": "Same picture as Endocrine: a small short-term effect in weak trials, no long-term data.", "src": ["Reviews of auriculotherapy for obesity"]}, "stomach": {"name": "Stomach", "alt": "胃", "zone": "End of the crus of the helix", "trad": "Digestion, nausea, appetite.", "why": "On the inverted-fetus map the crus of the helix is the diaphragm, with the abdominal organs arranged around it.", "evi": "No reliable data on its own. For nausea the evidence belongs to a wrist point (PC6, Neiguan), not an ear point.", "src": ["Cochrane: PC6 stimulation for postoperative nausea"]}, "lumbar": {"name": "Lumbar spine", "alt": "after Nogier", "zone": "Antihelix, middle part", "trad": "Low back pain.", "why": "Nogier’s map: the antihelix is the spine of an inverted fetus, pubis at the top, neck at the bottom.", "evi": "Paul Nogier proposed the inverted-fetus map in 1957 from clinical observation. There is no anatomical projection of the spine onto the ear. Back-pain trials exist but are small and use different points.", "src": ["Nogier P., 1957"]}, "cervical": {"name": "Cervical spine", "alt": "after Nogier", "zone": "Antihelix, lower part", "trad": "Neck pain, tension headache.", "why": "Same Nogier map: the lower antihelix corresponds to the neck.", "evi": "No reliable data on its own.", "src": ["Nogier P., 1957"]}, "apex": {"name": "Ear apex", "alt": "耳尖", "zone": "Top of the helix", "trad": "Fever, inflammation, high blood pressure; traditionally a bloodletting site.", "why": "A historical point of Chinese medicine; bloodletting from the ear apex is described in old texts as a way to “release heat”.", "evi": "Trials exist only in Chinese journals and are of low quality. Bloodletting from the ear is not recommended today.", "src": ["Chinese standard GB/T 13734"]}, "eye": {"name": "Eye", "alt": "眼", "zone": "Centre of the earlobe", "trad": "Vision, eye strain.", "why": "On the inverted-fetus map the lobe is the head, with eyes, teeth and tongue placed on it.", "evi": "No data. The only real link between lobe and eye is historical: earrings were once worn “for eyesight”, and that seems to be the same myth.", "src": ["WHO nomenclature, 1990"]}, "zero": {"name": "Point Zero", "alt": "after Nogier", "zone": "Root of the helix", "trad": "The “balance point” of the whole body; a session starts here.", "why": "A Nogier concept, not Chinese. Seen as the centre around which the whole map is built.", "evi": "No studies.", "src": ["Nogier P., 1957"]}};

тся барабанной перепонкой.", "kv": [["кожа", "тонкая, без сосочков, плотно сращена с хрящом. Поэтому воспаление уха так болит"], ["хрящ", "единая пластина, повторяет все складки"], ["жир", "мочка и подкожная клетчатка"], ["кость", "внутренние две трети слухового прохода"]], "foot": "Это не назначение и не замена визита к врачу. Если что-то беспокоит, покажите это своему врачу.", "sig": "Виктория Филиппова · Kikodoc.design · 2026", "alt_img": "Правое ухо, вид сбоку", "alt_sec": "Срез через ушную раковину и наружный слуховой проход", "theme": "Переключить тему", "close": "Закрыть", "depth_aria": "Глубина среза", "filter_aria": "Фильтр по уровню доказательств"}, "en": {"title": "The ear.<br><em>A point atlas</em>, layer by layer", "by": "An atlas by Viktoria Filippova — a clinical laboratory physician turned UX designer. ", "lead": "Slide the depth: skin, vessels, nerves, muscles, cartilage. Tap a point: what tradition claims and what is actually known.", "s1": "points", "s2": "layers", "s3": "with systematic reviews", "depth": "Depth", "layers": ["skin", "vessels", "nerves", "muscles", "cartilage"], "f_all": "All", "f_2": "Has reviews", "f_01": "Tradition only", "l2": "systematic reviews", "l1": "single trials, low quality", "l0": "tradition only", "empty_h": "Tap a point", "empty_p": "Each one has two layers: tradition and research. Plus a line on what lies under the skin.", "h_trad": "What tradition says", "h_evi": "What is actually known", "under": "Under the skin.", "cart": "A plate of elastic cartilage.", "lobe": "The lobe: no cartilage, fat and fibrous tissue.", "innerv": "The skin here is supplied by the", "show": "Show the zone on the nerve layer", "LVL": {"2": "has reviews", "1": "low-quality trials", "0": "tradition only"}, "NERVE": {"atn": "auriculotemporal nerve (trigeminal, V3): tragus, crus of the helix and the adjacent helix", "gan": "great auricular nerve (cervical plexus, C2–C3): helix, antihelix, lobe", "loc": "lesser occipital nerve (C2): upper rim let lang="ru";try{lang=localStorage.getItem("ear-lang")||"ru"}catch(e){}
const T=()=>UI[lang];const F=(p,k)=>lang==="en"?EN[p.id][k]:p[k];
let LVL=T().LVL;
let NERVE=T().NERVE;
const G=(n,p)=>{try{ym(110440302,"reachGoal",n,p)}catch(e){}};
const ear=document.getElementById("ear"),card=document.getElementById("card"),list=document.getElementById("list");
P.forEach(p=>{
  const b=document.createElement("button");b.className="pt";b.dataset.id=p.id;b.dataset.l=p.lvl;
  b.style.left=p.x+"%";b.style.top=p.y+"%";b.setAttribute("aria-pressed","false");b.setAttribute("aria-label",F(p,"name")+", "+LVL[p.lvl]);
  b.innerHTML='<i></i><span class="pt-tip">'+F(p,"name")+'</span>';b.addEventListener("click",()=>select(p.id));ear.append(b);
  const l=document.createElement("button");l.dataset.id=p.id;l.dataset.l=p.lvl;l.innerHTML='<i></i>'+F(p,"name");l.addEventListener("click",()=>select(p.id));list.append(l);
});
function select(id){
  const p=P.find(x=>x.id===id);G("point",{id:id,lang:lang});
  document.querySelectorAll(".pt").forEach(g=>g.setAttribute("aria-pressed",g.dataset.id===id));
  document.querySelectorAll(".list button").forEach(b=>b.setAttribute("aria-current",b.dataset.id===id));
  card.classList.remove("empty-state");card.classList.add("open");
  const zs=document.getElementById("zones");zs.classList.add("focus");zs.querySelectorAll(".nz").forEach(q=>q.classList.toggle("on",q.dataset.n===p.nerve));
  const u=T();
  card.innerHTML=`<button class="close" aria-label="${u.close}" onclick="closeCard()">×</button>
    <p class="zone">${F(p,"zone")}</p>
    <h2>${F(p,"name")}<span class="badge b${p.lvl}">${LVL[p.lvl]}</span></h2>
    <p class="alt">${F(p,"alt")}</p>
    <div class="layer trad"><h3>${u.h_trad}</h3><p>${F(p,"trad")}</p><p>${F(p,"why")}</p></div>
    <div class="layer evi lvl${p.lvl}"><h3>${u.h_evi}</h3><p>${F(p,"evi")}</p><ul class="src">${F(p,"src").map(s=>"<li>"+s+"</li>").join("")}</ul></div>
    <p class="under"><b>${u.under}</b> ${p.id==="eye"?u.lobe:u.cart} ${u.innerv} ${NERVE[p.nerve]}. <button onclick="setDepth(200)">${u.show}</button></p>`;
}
function closeCard(){card.classList.remove("open");document.querySelectorAll(".pt").forEach(g=>g.setAttribute("aria-pressed","false"))}
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
  const f=c.dataset.f,ok=l=>f==="all"||(f==="2"&&l===2)||(f==="01"&&l<2);
  document.querySelectorAll(".pt,.list button").forEach(b=>b.classList.toggle("dim",!ok(+b.dataset.l)));
  const sel=document.querySelector('.pt[aria-pressed="true"]');if(sel&&!ok(+sel.dataset.l))closeCard();
}));
const depth=document.getElementById("depth"),imgs=[...ear.querySelectorAll("img")],ln=document.getElementById("ln");let names=T().layers;
function render(){
  const v=+depth.value;
  imgs.forEach(im=>{const i=+im.dataset.i;im.style.opacity=i===0?1:Math.max(0,Math.min(1,1-Math.abs(v-100*i)/100+ (v>100*i?1:0)));});
  const n=Math.round(v/100);ln.textContent=names[n];depth.setAttribute("aria-valuetext",names[n]);
  document.querySelectorAll("#dl button").forEach(b=>b.setAttribute("aria-current",+b.dataset.v===n*100));
}
/* stacking: deeper layers sit below; a layer becomes visible as depth passes it, so fade the shallower ones out instead */
function render(){
  const v=+depth.value;
  imgs.forEach(im=>{const i=+im.dataset.i;im.style.opacity=Math.max(0,Math.min(1,1-(v-100*i)/100));});
  const n=Math.round(v/100);ln.textContent=names[n];depth.setAttribute("aria-valuetext",names[n]);
  document.querySelectorAll("#dl button").forEach(b=>b.setAttribute("aria-current",+b.dataset.v===n*100));
  const z=Math.max(0,1-Math.abs(v-200)/80);document.getElementById("zones").style.opacity=z;document.getElementById("zl").style.opacity=z;
}
depth.addEventListener("change",()=>G("depth",{layer:names[Math.round(depth.value/100)]}));depth.addEventListener("input",render);render();
function setDepth(v){if(innerWidth<900)card.classList.remove("open");const s=+depth.value,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/500);depth.value=s+(v-s)*(1-Math.pow(1-k,3));render();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);ear.scrollIntoView({behavior:"smooth",block:"center"})}
document.querySelectorAll("#dl button").forEach(b=>b.addEventListener("click",()=>setDepth(+b.dataset.v)));
function applyLang(){
  const u=T();LVL=u.LVL;NERVE=u.NERVE;names=u.layers;document.documentElement.lang=lang;document.getElementById("lang").textContent=lang==="ru"?"EN":"RU";
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=u[el.dataset.t]});
  document.querySelectorAll("#dl button").forEach((b,i)=>b.textContent=u.layers[i]);
  document.querySelectorAll("#zl span").forEach(sp=>sp.textContent=u.zl[sp.dataset.n]);
  document.getElementById("kv").innerHTML=u.kv.map((r,i)=>`<b><span class="sw" style="background:${["#E9A08B","#B9C6D8","#F2D27A","#E8DFC8"][i]}"></span>${r[0]}</b><span>${r[1]}</span>`).join("");
  document.getElementById("theme").setAttribute("aria-label",u.theme);depth.setAttribute("aria-label",u.depth_aria);document.querySelector(".filters").setAttribute("aria-label",u.filter_aria);
  document.querySelector("#ear img[data-i='0']").alt=u.alt_img;document.querySelector(".section img").alt=u.alt_sec;
  P.forEach(p=>{const b=ear.querySelector(`.pt[data-id="${p.id}"]`);b.setAttribute("aria-label",F(p,"name")+", "+LVL[p.lvl]);b.querySelector(".pt-tip").textContent=F(p,"name");list.querySelector(`button[data-id="${p.id}"]`).innerHTML='<i></i>'+F(p,"name")});
  render();const sel=document.querySelector('.pt[aria-pressed="true"]');if(sel)select(sel.dataset.id);
}
document.getElementById("lang").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";G("lang",{lang:lang});try{localStorage.setItem("ear-lang",lang)}catch(e){}applyLang()});
applyLang();
const root=document.documentElement,tb=document.getElementById("theme");
try{const t=localStorage.getItem("ear-theme");if(t)root.dataset.theme=t}catch(e){}
tb.addEventListener("click",()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("ear-theme",root.dataset.theme)}catch(e){}});
</script>
